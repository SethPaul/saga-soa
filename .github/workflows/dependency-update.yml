name: Dependency Updates

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  # Job 1: Update Dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies
        run: |
          # Update all dependencies to latest compatible versions
          pnpm update --latest --recursive
          
          # Update Nx to latest version
          pnpm exec nx migrate latest
          
          # Apply migrations if any
          if [ -f migrations.json ]; then
            pnpm exec nx migrate --run-migrations
            rm migrations.json
          fi

      - name: Run tests after update
        run: |
          # Install updated dependencies
          pnpm install
          
          # Run tests to ensure updates don't break functionality
          pnpm ci:test
          
          # Build to ensure no compilation errors
          pnpm exec nx build api

      - name: Check for security vulnerabilities
        run: |
          # Run security audit
          pnpm audit --audit-level moderate || echo "Security issues found"
          
          # Generate audit report
          pnpm audit --json > security-audit.json || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update dependencies
            
            - Updated all dependencies to latest compatible versions
            - Applied Nx migrations
            - Verified tests pass with updates
          title: 'chore: automated dependency updates'
          body: |
            ## 🔄 Automated Dependency Updates
            
            This PR contains automated updates to keep dependencies current and secure.
            
            ### Changes
            - ⬆️ Updated all dependencies to latest compatible versions
            - 🔧 Applied Nx migrations if any
            - ✅ Verified all tests pass
            - 🛡️ Security audit completed
            
            ### Verification
            - [x] Tests pass
            - [x] Build succeeds
            - [x] Security audit completed
            
            **Note**: Please review the changes before merging.
          branch: automated/dependency-updates
          branch-suffix: timestamp
          delete-branch: true

  # Job 2: Security Monitoring
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run comprehensive security audit
        run: |
          # Create security report
          echo "# Security Audit Report" > security-report.md
          echo "Generated on: $(date)" >> security-report.md
          echo "" >> security-report.md
          
          # Check for known vulnerabilities
          echo "## Dependency Vulnerabilities" >> security-report.md
          pnpm audit --json > audit.json || true
          
          if [ -s audit.json ]; then
            echo "Found security issues:" >> security-report.md
            jq -r '.advisories | to_entries[] | "- \(.value.title) (\(.value.severity))"' audit.json >> security-report.md
          else
            echo "No known vulnerabilities found ✅" >> security-report.md
          fi

      - name: Check outdated packages
        run: |
          echo "" >> security-report.md
          echo "## Outdated Packages" >> security-report.md
          pnpm outdated || echo "All packages are up to date ✅" >> security-report.md

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

  # Job 3: License Compliance Check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install license checker
        run: pnpm add -D license-checker

      - name: Check licenses
        run: |
          # Generate license report
          npx license-checker --json > licenses.json
          
          # Check for prohibited licenses
          prohibited_licenses="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"
          
          if npx license-checker --onlyAllow "MIT;ISC;BSD;Apache-2.0;Unlicense;WTFPL" --excludePrivatePackages; then
            echo "✅ All licenses are compliant"
          else
            echo "❌ Found non-compliant licenses"
            exit 1
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json