version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: saga-soa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: saga-soa
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - saga-soa-network

  # Redis (optional for caching)
  redis:
    image: redis:7-alpine
    container_name: saga-soa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saga-soa-network

  # NestJS API application
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saga-soa-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: saga-soa-api
      # MongoDB configuration
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: saga-soa
      MONGO_USERNAME: admin
      MONGO_PASSWORD: password
      MONGO_INSTANCE_NAME: default
      # Optional Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - saga-soa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  saga-soa-network:
    driver: bridge